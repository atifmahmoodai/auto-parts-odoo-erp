name: Verify native Odoo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check CSV contract and source syntax
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q addons tests scripts
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for path in Path('addons').rglob('*.xml'): ElementTree.parse(path)
          PY
      - name: Initialize isolated PostgreSQL
        run: |
          docker network create parts-ci
          docker run -d --name parts-db --network parts-ci -e POSTGRES_PASSWORD=disposable-ci-password postgres:17
          for n in $(seq 1 40); do
            if docker exec parts-db pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec parts-db psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE odoo LOGIN CREATEDB NOSUPERUSER PASSWORD 'disposable-odoo-password';"
      - name: Install and test Odoo 19 workflows
        run: |
          set -o pipefail
          mkdir -p evidence
          docker run --rm --network parts-ci -e HOST=parts-db -e USER=odoo -e PASSWORD=disposable-odoo-password \
            -v "$PWD/addons:/mnt/extra-addons:ro" odoo:19.0 \
            odoo -d parts_test -i auto_parts_dealer,l10n_us_account --without-demo=all \
            --test-enable --test-tags /auto_parts_dealer --stop-after-init --max-cron-threads=0 \
            --log-level=test 2>&1 | tee evidence/odoo-tests.log
          grep -E '[1-9][0-9]* tests? passed|0 failed, 0 error\(s\) of [1-9][0-9]* tests' evidence/odoo-tests.log
      - name: Verify module upgrade
        run: |
          set -o pipefail
          docker run --rm --network parts-ci -e HOST=parts-db -e USER=odoo -e PASSWORD=disposable-odoo-password \
            -v "$PWD/addons:/mnt/extra-addons:ro" odoo:19.0 \
            odoo -d parts_test -u auto_parts_dealer --stop-after-init --max-cron-threads=0 2>&1 | tee evidence/odoo-upgrade.log
      - name: Verify database backup restore
        run: |
          docker exec parts-db pg_dump -U odoo -Fc parts_test > evidence/parts-test.dump
          docker exec parts-db createdb -U odoo parts_restored
          docker exec -i parts-db pg_restore -U odoo --no-owner --exit-on-error -d parts_restored < evidence/parts-test.dump
          test "$(docker exec parts-db psql -U odoo -d parts_restored -Atc "SELECT state FROM ir_module_module WHERE name='auto_parts_dealer'")" = installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-odoo-evidence
          path: evidence/
          retention-days: 7
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOMAIN: localhost
      POSTGRES_ADMIN_PASSWORD: disposable-ci-postgres-admin-password-001
      ODOO_DB_PASSWORD: disposable-ci-odoo-database-password-002
      ODOO_MASTER_PASSWORD: disposable-ci-odoo-master-password-003
      INITIAL_ADMIN_LOGIN: parts-admin@example.invalid
      INITIAL_ADMIN_PASSWORD: disposable-ci-admin-password-004
    steps:
      - uses: actions/checkout@v4
      - name: Validate and initialize deployment stack
        run: |
          docker compose config --quiet
          bash scripts/initialize.sh
          test "$(docker compose exec -T db psql -U postgres -d parts -Atc "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname='odoo'")" = f
          docker compose run -d --name parts-web -p 127.0.0.1:8069:8069 odoo
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8069/web/login > /dev/null; then break; fi
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual Odoo interface
        run: node scripts/browser-smoke.cjs
      - name: Capture deployment logs
        if: always()
        run: |
          mkdir -p evidence
          docker logs parts-web > evidence/deployment.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-browser-evidence
          path: evidence/
          retention-days: 7
      - name: Clean up disposable volumes
        if: always()
        run: |
          docker rm -f parts-web || true
          docker compose down -v
